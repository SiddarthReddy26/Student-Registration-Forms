<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Registration System</title>

    <link rel="stylesheet" href="styles/style.css">
</head>

<body>

    <header>
        <h1>Student Management System</h1>
        <p>Student Registration and Login Portal</p>
    </header>

    <main class="container">

        <section id="registerSection" class="form-section">
            <h2>Student Registration</h2>

            <form id="registerForm">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" required>

                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" required>

                <label for="password">Password</label>
                <input type="password" id="password" name="password" required minlength="8">

                <label for="dob">Date of Birth</label>
                <input type="date" id="dob" name="dob" required>

                <fieldset>
                    <legend>Gender</legend>

                    <label>
                        <input type="radio" name="gender" value="Male" required>
                        Male
                    </label>

                    <label>
                        <input type="radio" name="gender" value="Female">
                        Female
                    </label>

                    <label>
                        <input type="radio" name="gender" value="Other">
                        Other
                    </label>
                </fieldset>

                <label for="qualification">Qualification</label>
                <select id="qualification" name="qualification" required>
                    <option value="">Select Qualification</option>
                    <option value="10th">10th</option>
                    <option value="Intermediate">Intermediate</option>
                    <option value="Diploma">Diploma</option>
                    <option value="Degree">Degree</option>
                    <option value="B.Tech">B.Tech</option>
                    <option value="Other">Other</option>
                </select>

                <fieldset>
                    <legend>Interests</legend>

                    <label>
                        <input type="checkbox" name="interests" value="Programming">
                        Programming
                    </label>

                    <label>
                        <input type="checkbox" name="interests" value="Sports">
                        Sports
                    </label>

                    <label>
                        <input type="checkbox" name="interests" value="Music">
                        Music
                    </label>

                    <label>
                        <input type="checkbox" name="interests" value="Reading">
                        Reading
                    </label>
                </fieldset>

                <label for="studentClass">Class</label>
                <input type="text" id="studentClass" name="studentClass" required>

                <label for="subject">Subject</label>
                <input type="text" id="subject" name="subject" required>

                <label for="marks">Marks</label>
                <input type="number" id="marks" name="marks" min="0" max="100" required>

                <label for="aadhaar">Aadhaar Document (PDF only)</label>
                <input type="file" id="aadhaar" name="aadhaar" accept=".pdf,application/pdf" required>

                <p id="registerMessage" role="alert"></p>

                <button type="submit">Register</button>
            </form>

            <p>
                Already registered?
                <button type="button" id="showLogin">Login</button>
            </p>
        </section>

        <section id="loginSection" class="form-section" hidden>
            <h2>Login</h2>

            <form id="loginForm">
                <label for="loginEmail">Email Address</label>
                <input type="email" id="loginEmail" name="loginEmail" required>

                <label for="loginPassword">Password</label>
                <input type="password" id="loginPassword" name="loginPassword" required>

                <p id="loginMessage" role="alert"></p>

                <button type="submit">Login</button>
            </form>

            <p>
                <button type="button" id="showForgot">Forgot Password?</button>
            </p>

            <p>
                New student?
                <button type="button" id="showRegister">Register here</button>
            </p>
        </section>

        <section id="forgotSection" class="form-section" hidden>
            <h2>Reset Password</h2>

            <form id="forgotForm">
                <label for="forgotEmail">Registered Email</label>
                <input type="email" id="forgotEmail" name="forgotEmail" required>

                <label for="newPassword">New Password</label>
                <input type="password" id="newPassword" name="newPassword" minlength="8" required>

                <p id="forgotMessage" role="alert"></p>

                <button type="submit">Reset Password</button>
            </form>

            <button type="button" id="backToLogin">Back to Login</button>
        </section>

    </main>
    <script src="js files/script.js"></script>

</body>
</html>
